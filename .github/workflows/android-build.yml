name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to build (leave empty to build the branch this workflow was started from)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-android:
    name: Android (arm64)
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          submodules: recursive
          fetch-depth: 0

      - name: Show what is being built
        run: |
          echo "Building ref: ${{ inputs.ref || github.ref }}"
          git log -1 --format='commit %h by %an: %s'
          grep -n "applicationId =" src/android/app/build.gradle.kts | head -2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          set -eu
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-36" "ndk;28.2.13676358" "cmake;3.31.6"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build glslang-tools nasm

      - name: Build APK
        env:
          GIT_TAG_NAME: v0.0.6
        run: |
          set -eu
          sh .ci/android/build.sh -t standard -b Debug
          mkdir -p out
          cp artifacts/app-mainline-debug.apk out/dark-switch-0.0.6-debug-arm64.apk
          ls -l out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dark-switch-android-apk
          path: out/dark-switch-0.0.6-debug-arm64.apk
          if-no-files-found: error
